<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b14"/>
      <stop offset="1" stop-color="#07070c"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e879f9"/>
      <stop offset="0.5" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="20%" r="50%">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="85%" r="55%">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <text x="80" y="110" font-size="26" letter-spacing="6" fill="#a1a1aa"
        font-family="'Space Grotesk', system-ui, sans-serif" font-weight="600">QUIZLAB</text>

  <text x="600" y="150" font-size="110" text-anchor="middle">📱</text>

  <text x="600" y="300" font-size="92" text-anchor="middle" fill="url(#txt)"
        font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700">HOW CHRONICALLY</text>
  <text x="600" y="400" font-size="92" text-anchor="middle" fill="url(#txt)"
        font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700">ONLINE ARE YOU?</text>

  <text x="600" y="480" font-size="38" text-anchor="middle" fill="#d4d4d8"
        font-family="'Space Grotesk', system-ui, sans-serif">There's normal online… and then there's you.</text>

  <rect x="430" y="525" width="340" height="68" rx="34" fill="#ec4899"/>
  <text x="600" y="569" font-size="34" text-anchor="middle" fill="#ffffff"
        font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700">TAKE THE TEST →</text>
</svg>
