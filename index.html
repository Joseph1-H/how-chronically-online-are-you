<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07070c" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Primary SEO -->
    <title>How Chronically Online Are You? | Take the Quiz</title>
    <meta
      name="description"
      content="Take the 2-minute internet culture quiz and find out how chronically online you really are."
    />
    <link rel="canonical" href="https://chronically-online.example.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QuizLab" />
    <meta property="og:title" content="How Chronically Online Are You?" />
    <meta
      property="og:description"
      content="There's normal online… and then there's you. Take the 2-minute quiz and find your internet archetype."
    />
    <meta property="og:url" content="https://chronically-online.example.com/" />
    <meta property="og:image" content="https://chronically-online.example.com/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="How Chronically Online Are You?" />
    <meta
      name="twitter:description"
      content="There's normal online… and then there's you. Find your internet archetype in 2 minutes."
    />
    <meta name="twitter:image" content="https://chronically-online.example.com/og-image.svg" />

    <!-- Fonts (optional, self-degrades to system fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
